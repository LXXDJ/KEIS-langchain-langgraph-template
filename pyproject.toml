[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agents", "app"]

[project]
name = "langchain-deep-agent-template"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "deepagents>=0.4.11",
    "langchain>=1.2.13",
    "langchain-core>=1.2.20",
    "langchain-openai>=1.1.11",
    "langgraph>=1.1.3",
    "langserve[all]>=0.3.3",
    "uvicorn>=0.42.0",
]

[dependency-groups]
dev = [
    "ruff>=0.11",
]

# ── Ruff ─────────────────────────────────────────────────────

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade (PEP 604 등 최신 문법 강제)
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
]
ignore = [
    "E501",  # line-length는 formatter가 처리
]

[tool.ruff.lint.isort]
known-first-party = ["agents", "app"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
